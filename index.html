<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบบันทึกข้อความอิเล็กทรอนิกส์ | ภาควิชาเทคโนโลยีและสื่อสารการศึกษา มมส</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- ไลบรารีแปลง HTML เป็น Word (.docx) -->
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Sarabun',sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-800">

<!-- หน้าเข้าสู่ระบบ -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-purple-700 rounded-full mx-auto flex items-center justify-center text-white text-3xl">📝</div>
      <h1 class="text-xl font-bold mt-3">ระบบบันทึกข้อความ (E-Memo)</h1>
      <p class="text-xs text-slate-500 mt-1">ภาควิชาเทคโนโลยีและสื่อสารการศึกษา<br>คณะศึกษาศาสตร์ มหาวิทยาลัยมหาสารคาม</p>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs text-slate-600 font-semibold">ชื่อผู้ใช้</label><input id="u" placeholder="เช่น admin หรือ officer" class="w-full border rounded-lg px-4 py-2 mt-1 outline-none focus:ring-2 ring-purple-400 text-sm"></div>
      <div><label class="text-xs text-slate-600 font-semibold">รหัสผ่าน</label><input id="p" type="password" placeholder="รหัสผ่าน" class="w-full border rounded-lg px-4 py-2 mt-1 outline-none focus:ring-2 ring-purple-400 text-sm"></div>
      <p id="loginErr" class="text-red-600 text-xs hidden"></p>
      <button onclick="doLogin()" class="w-full bg-purple-700 hover:bg-purple-800 text-white py-2.5 rounded-lg font-semibold text-sm mt-2">เข้าสู่ระบบ</button>
    </div>
    <div class="mt-5 text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border">
      <b>บัญชีทดลองตั้งต้น:</b><br>• แอดมิน: <code>admin</code> / <code>admin123</code><br>• เจ้าหน้าที่: <code>officer</code> / <code>1234</code><br><i>(รหัสผ่านแก้ไขที่ชีต Users ใน Google Sheet ได้ทันที)</i>
    </div>
  </div>
</div>

<!-- หน้าหลักระบบ -->
<div id="app" class="hidden min-h-screen flex">
  <aside class="w-64 bg-purple-900 text-purple-100 flex flex-col">
    <div class="p-5 border-b border-purple-800">
      <div class="font-bold text-white">E-Memo EdTech MSU</div>
      <div class="text-xs text-purple-300">ระบบสารบรรณบันทึกข้อความ</div>
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm">
      <a href="#" class="block px-3 py-2 rounded-lg bg-purple-800 font-semibold text-white">📋 ทะเบียนบันทึกข้อความ</a>
    </nav>
    <div class="p-4 border-t border-purple-800 text-sm">
      <div id="meName" class="font-semibold text-white"></div>
      <div id="meRole" class="text-xs text-purple-300 mb-2"></div>
      <button onclick="logout()" class="text-xs bg-purple-700 hover:bg-purple-600 text-white px-3 py-1.5 rounded w-full">ออกจากระบบ</button>
    </div>
  </aside>
  <main id="content" class="flex-1 p-8 overflow-auto"></main>
</div>

<!-- Modal ฟอร์มสร้าง/แก้ไขบันทึกข้อความ -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl w-full max-w-4xl max-h-[92vh] overflow-auto p-6 shadow-2xl">
    <div class="flex justify-between items-center pb-3 border-b mb-4">
      <h3 id="mTitle" class="font-bold text-lg text-purple-900"></h3>
      <button onclick="closeModal()" class="text-2xl font-bold">&times;</button>
    </div>
    <div id="mBody" class="space-y-4"></div>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzFsEgjvUxmw9Ekn4YP_sbXFzwp4rAY03KYoYzxtLx_Tdb5R2zNwQruORaOZ-NzjFEM/exec'
};
let ME = null, MEMOS = [];

async function api(action, payload = {}) {
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  return await r.json();
}

async function doLogin(){
  const res = await api('login', { username: u.value.trim(), password: p.value.trim() });
  if(!res.ok){ loginErr.textContent = res.error; loginErr.classList.remove('hidden'); return; }
  ME = res.data; startApp();
}
function logout(){ location.reload(); }

function startApp(){
  loginPage.classList.add('hidden'); app.classList.remove('hidden');
  meName.textContent = ME.fullName; meRole.textContent = ME.position;
  loadMemos();
}

async function loadMemos(){
  const res = await api('list', { sheet: 'Memos' });
  MEMOS = res.ok ? res.data : [];
  
  content.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">ทะเบียนบันทึกข้อความราชการ</h2>
        <p class="text-sm text-slate-500">ภาควิชาเทคโนโลยีและสื่อสารการศึกษา คณะศึกษาศาสตร์ มหาวิทยาลัยมหาสารคาม</p>
      </div>
      <button onclick="openForm()" class="bg-purple-700 hover:bg-purple-800 text-white px-4 py-2.5 rounded-lg font-semibold text-sm shadow">+ สร้างบันทึกข้อความใหม่</button>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden border">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 border-b text-slate-600">
          <tr>
            <th class="p-3">ที่หนังสือ</th>
            <th class="p-3">วันที่</th>
            <th class="p-3">เรื่อง</th>
            <th class="p-3">ผู้รับ (ถึง)</th>
            <th class="p-3 text-right">จัดการ / ส่งออก</th>
          </tr>
        </thead>
        <tbody>
          ${MEMOS.length ? MEMOS.map(m => `
            <tr class="border-b hover:bg-slate-50">
              <td class="p-3 font-semibold">${m.DocNo}</td>
              <td class="p-3">${m.DocDate}</td>
              <td class="p-3 font-medium text-purple-900">${m.Subject}</td>
              <td class="p-3">${m.ToDept}</td>
              <td class="p-3 text-right space-x-2">
                <button onclick="exportWord('${m.MemoID}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-semibold">📥 โหลด Word</button>
                <button onclick="openForm('${m.MemoID}')" class="text-amber-600 hover:underline text-xs font-semibold">แก้ไข</button>
                <button onclick="delMemo('${m.MemoID}')" class="text-red-600 hover:underline text-xs font-semibold">ลบ</button>
              </td>
            </tr>`).join('') : `<tr><td colspan="5" class="p-8 text-center text-slate-400">ยังไม่มีประวัติการสร้างบันทึกข้อความในระบบ</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function openForm(id){
  const m = id ? MEMOS.find(x => x.MemoID === id) : {
    MemoID: '',
    DocNo: 'อว 0605.6/',
    DocDate: new Date().toISOString().slice(0,10),
    FromDept: 'ภาควิชาเทคโนโลยีและสื่อสารการศึกษา โทร. ๐ ๔๓๗๕ ๔๓๒๑',
    ToDept: 'คณบดีคณะศึกษาศาสตร์',
    Subject: '',
    Content: '',
    SenderName: ME.fullName,
    SenderPos: ME.position
  };
  
  mTitle.textContent = id ? 'แก้ไขบันทึกข้อความ' : 'สร้างบันทึกข้อความราชการใหม่';
  mBody.innerHTML = `
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div><label class="font-semibold text-slate-600">ที่หนังสือ</label><input id="f_DocNo" value="${m.DocNo}" class="w-full border rounded px-3 py-2 mt-1"></div>
      <div><label class="font-semibold text-slate-600">วันที่</label><input id="f_DocDate" type="date" value="${m.DocDate}" class="w-full border rounded px-3 py-2 mt-1"></div>
      
      <div class="col-span-2"><label class="font-semibold text-slate-600">ส่วนราชการ (จาก)</label><input id="f_FromDept" value="${m.FromDept}" class="w-full border rounded px-3 py-2 mt-1"></div>
      <div class="col-span-2"><label class="font-semibold text-slate-600">เรียน (ถึง)</label><input id="f_ToDept" value="${m.ToDept}" class="w-full border rounded px-3 py-2 mt-1"></div>
      <div class="col-span-2"><label class="font-semibold text-slate-600">เรื่อง</label><input id="f_Subject" value="${m.Subject}" class="w-full border rounded px-3 py-2 mt-1"></div>
      
      <div class="col-span-2">
        <label class="font-semibold text-slate-600">เนื้อหาบันทึกข้อความ (ระบบจะจัดย่อหน้า 2.5 ซม. อัตโนมัติ)</label>
        <textarea id="f_Content" rows="6" class="w-full border rounded px-3 py-2 mt-1 leading-relaxed" placeholder="พิมพ์รายละเอียดเนื้อหาที่นี่...">${m.Content}</textarea>
      </div>

      <div><label class="font-semibold text-slate-600">ชื่อผู้ลงนาม</label><input id="f_SenderName" value="${m.SenderName}" class="w-full border rounded px-3 py-2 mt-1"></div>
      <div><label class="font-semibold text-slate-600">ตำแหน่งผู้ลงนาม</label><input id="f_SenderPos" value="${m.SenderPos}" class="w-full border rounded px-3 py-2 mt-1"></div>
    </div>

    <div class="mt-6 flex justify-end gap-2 pt-3 border-t">
      <button onclick="closeModal()" class="px-4 py-2 border rounded text-sm">ยกเลิก</button>
      <button onclick="saveMemo('${id||''}')" class="px-5 py-2 bg-purple-700 hover:bg-purple-800 text-white rounded font-semibold text-sm">บันทึกข้อมูลลง Sheet</button>
    </div>`;
  modal.classList.remove('hidden');
}

async function saveMemo(id){
  const rec = {
    MemoID: id,
    DocNo: document.getElementById('f_DocNo').value,
    DocDate: document.getElementById('f_DocDate').value,
    FromDept: document.getElementById('f_FromDept').value,
    ToDept: document.getElementById('f_ToDept').value,
    Subject: document.getElementById('f_Subject').value,
    Content: document.getElementById('f_Content').value,
    SenderName: document.getElementById('f_SenderName').value,
    SenderPos: document.getElementById('f_SenderPos').value,
    CreatedBy: ME.username
  };
  await api('save', { sheet: 'Memos', record: rec });
  closeModal(); loadMemos();
}

async function delMemo(id){
  if(!confirm('ยืนยันการลบบันทึกข้อความฉบับนี้?')) return;
  await api('delete', { sheet: 'Memos', id });
  loadMemos();
}

// ฟังก์ชันแปลงเอกสารพร้อมตราครุฑและจัดรูปแบบตามระเบียบงานสารบรรณ ส่งออกเป็นไฟล์ .docx
function exportWord(id){
  const m = MEMOS.find(x => x.MemoID === id);
  if(!m) return;

  // URL ตราครุฑมาตรฐาน (PNG พื้นหลังโปร่งใส สำหรับใช้ในเอกสารราชการ)
  const garudaUrl = "https://upload.wikimedia.org/wikipedia/commons/f/fa/Emblem_of_Thailand.svg";

  const htmlContent = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>${m.Subject}</title>
    <style>
      body { font-family: 'TH Sarabun PSK', 'Sarabun', sans-serif; font-size: 16pt; line-height: 1.0; margin-top: 2.5cm; margin-bottom: 2.5cm; margin-left: 3cm; margin-right: 2.5cm; }
      .garuda-container { text-align: center; margin-bottom: 5px; }
      .garuda-img { width: 2.5cm; height: auto; }
      .memo-title { text-align: center; font-size: 29pt; font-weight: bold; line-height: 1.1; margin-bottom: 15px; }
      .header-table { width: 100%; border-collapse: collapse; font-size: 16pt; margin-bottom: 5px; }
      .header-table td { padding: 3px 0; vertical-align: top; }
      .divider { border: none; border-top: 1.5px solid #000; margin: 2px 0 10px 0; }
      .to-section { font-size: 16pt; margin-bottom: 15px; }
      .content { text-indent: 2.5cm; text-align: justify; margin-bottom: 20px; line-height: 1.2; }
      .signature { text-align: center; margin-top: 30px; margin-left: 50%; line-height: 1.2; font-size: 16pt; }
    </style>
    </head>
    <body>
      <!-- ตราครุฑ -->
      <div class="garuda-container">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Emblem_of_Thailand_%28Garuda%29.svg?width=300" class="garuda-img" alt="ตราครุฑ" />
      </div>

      <!-- หัวข้อบันทึกข้อความ -->
      <div class="memo-title">บันทึกข้อความ</div>
      
      <!-- ตารางส่วนราชการ ที่ วันที่ เรื่อง -->
      <table class="header-table">
        <tr>
          <td style="width: 100%;"><b>ส่วนราชการ:</b> ${m.FromDept}</td>
        </tr>
        <tr>
          <td>
            <table style="width: 100%; border-collapse: collapse;">
              <tr>
                <td style="width: 60%;"><b>ที่:</b> ${m.DocNo}</td>
                <td style="width: 40%;"><b>วันที่:</b> ${m.DocDate}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td><b>เรื่อง:</b> ${m.Subject}</td>
        </tr>
      </table>
      
      <hr class="divider" />
      
      <!-- เรียน -->
      <div class="to-section"><b>เรียน:</b> ${m.ToDept}</div>
      
      <!-- เนื้อหา -->
      <div class="content">
        ${m.Content.replace(/\n/g, '<br/><span style="display:inline-block; width:2.5cm;"></span>')}
      </div>
      
      <!-- ลงชื่อ -->
      <div class="signature">
        <p>( ${m.SenderName} )</p>
        <p>${m.SenderPos}</p>
      </div>
    </body>
    </html>`;

  const converted = htmlDocx.asBlob(htmlContent);
  const link = document.createElement('a');
  link.href = URL.createObjectURL(converted);
  link.download = `บันทึกข้อความ_${m.DocNo.replace(/\//g, '-')}.docx`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function closeModal(){ modal.classList.add('hidden'); }
</script>
</body>
</html>
